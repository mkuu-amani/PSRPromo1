    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        body {
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .promo-link {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .promo-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center center;
            background: #000;
            -webkit-user-drag: none;
            user-select: none;
        }

        .visit-hint {
            position: fixed;
            left: 50%;
            bottom: max(1.25rem, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            padding: 0.55rem 1rem;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.65);
            color: #f5d76e;
            font-size: 0.85rem;
            letter-spacing: 0.03em;
            pointer-events: none;
            backdrop-filter: blur(6px);
        }
    </style>

<body>
    <a
